name: API quality and PostgreSQL integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pfmea_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: testing
      RESEND_API_KEY: ''
      DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/pfmea_ci
      PFMEA_TEST_DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/pfmea_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m ruff check app scripts tests
      - run: python -m pytest -q
      - run: python -m compileall -q app scripts
      - run: python -m scripts.export_test_schema
      - run: python -m scripts.verify_postgres
      - name: Fresh migration runner and checksum replay
        env:
          DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/postgres
        run: |
          python run_migrations.py
          python run_migrations.py
      - run: python -m pip_audit
